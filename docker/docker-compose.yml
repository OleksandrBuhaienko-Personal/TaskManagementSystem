version: "3.9"
services:
  postgresdb:
    image: postgres:15
    container_name: local_pgdb
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tmspassword
      POSTGRES_DB: tms_database
    volumes:
      - pg-data:/var/lib/postgresql/data
  
  minio:
    container_name: local_minio
    image: bitnami/minio:2023.5.18-debian-11-r1
    ports:
      - "9000:9000"
      - "9001:9001"
    platform: linux/amd64
    environment:
      MINIO_ROOT_USER: admin_user
      MINIO_ROOT_PASSWORD: admin_pass
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  pg-data:
  rabbitmq-data:
  minio-data:
    